[package]
name = "build-time-insight"
version = "0.1.0"
edition = "2024"
license = "MIT"
exclude = ["docs/images/*"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11.11"
flate2 = "1.0"
glob = "0.3.4"
indicatif = "0.17"
itertools = "0.15.0"
log = "0.4.33"
rayon = "1.12.0"
rmp-serde = "1.3.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
